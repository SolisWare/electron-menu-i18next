name: SolisWare electron-menu-i18next CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Compatibility / Node.js ${{ matrix.node }}
    needs: [functionality, integration, typecheck]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [16, 18, 20, 22, 24, 26]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:compatibility

  functionality:
    name: Functionality tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:functionality

  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:integration

  javascript-consumers:
    name: JavaScript consumers
    needs: [compatibility, i18next-compatibility]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:consumer:javascript

  i18next-compatibility:
    name: i18next / ${{ matrix.i18next }}
    needs: [functionality, integration, typecheck]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        i18next: ["21", "22", "23", "24", "25", "latest"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Install i18next ${{ matrix.i18next }}
        run: npm install --no-save --package-lock=false i18next@${{ matrix.i18next }}
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:integration
      - run: npm run test:consumer:typescript

  typecheck:
    name: Source typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  typescript-consumer:
    name: TypeScript consumer
    needs: [compatibility, i18next-compatibility]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:consumer:typescript

  package:
    name: Package artifact
    needs:
      - javascript-consumers
      - typescript-consumer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Create npm package
        id: artifact
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          artifact_name="solisware-electron-menu-i18next-v${package_version}-b${GITHUB_RUN_NUMBER}"
          mkdir -p artifacts
          packed_filename="$(npm pack --silent --pack-destination artifacts | tail -n 1)"
          mv "artifacts/${packed_filename}" "artifacts/${artifact_name}.tgz"
          echo "name=${artifact_name}" >> "$GITHUB_OUTPUT"
          echo "path=artifacts/${artifact_name}.tgz" >> "$GITHUB_OUTPUT"
      - name: Install example dependencies
        run: npm ci --ignore-scripts --prefix examples/basic
      - name: Install generated package in example
        run: |
          package_path="$GITHUB_WORKSPACE/${{ steps.artifact.outputs.path }}"
          npm pkg set "dependencies.electron-menu-i18next=file:${package_path}" --prefix examples/basic
          npm install --ignore-scripts --package-lock=false --prefix examples/basic
      - name: Build JavaScript and TypeScript examples
        run: npm run build --prefix examples/basic
      - name: Upload npm package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
